name: Apply V50 AI PROCESS controls
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v50-ai-process-controls.mjs'
      - 'scripts/fix-v50-generated-escapes.mjs'
      - '.github/workflows/apply-v50-ai-process-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-check-key
    steps:
      - uses: actions/checkout@v4
      - name: Apply V50 patch
        run: node scripts/apply-v50-ai-process-controls.mjs
      - name: Normalize generated JSX
        run: node scripts/fix-v50-generated-escapes.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/globals.css
          git commit -m "feat: V50 AI PROCESS admin controls and user sync"
          git push
