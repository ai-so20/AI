name: Apply V18 convenience UI

on:
  push:
    paths:
      - ".github/workflows/apply-v18-convenience-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply convenience UI patch
        run: node scripts/apply-v18-convenience-ui.mjs

      - name: Validate JavaScript
        run: node --check app/page.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git commit -m "feat: move private guide into chat and add smart shortcuts"
          git push

# rerun after script syntax fix
