name: Apply V52 design system
on:
  push:
    paths:
      - 'scripts/apply-v52-design-system.mjs'
      - '.github/workflows/apply-v52-design-system.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V52 patch
        run: node scripts/apply-v52-design-system.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build validation
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css
          git commit -m 'feat: V52 unify typography spacing and admin design'
          git push
