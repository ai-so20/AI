name: One-time VIP copy and login cleanup

on:
  push:
    branches:
      - design-rebuild-20261019
    paths:
      - '.github/workflows/one-time-copy-login-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-rebuild-20261019
          fetch-depth: 0

      - name: Rewrite source copy and remove temporary guard
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.js')
          text = page.read_text(encoding='utf-8')

          replacements = {
              'AI PROCESS 모의체험을 시작했습니다.': 'AI PROCESS 체험을 시작했습니다.',
              '선정된 회원에게 1회 제공되는 모의 체험 이벤트입니다.': '선정된 회원에게 1회 제공되는 AI PROCESS 체험 이벤트입니다.',
              '실제 잔액 및 실제 정산과 분리된 모의체험입니다.': '별도 체험 혜택으로 진행되며 실제 잔액 및 정산과 구분됩니다.',
              '모의체험 진행 중': '체험 진행 중',
              '실제 잔액과 분리된 모의체험입니다. 시작하면 이 체험권은 사용 완료되어 다시 표시되지 않습니다.': '별도 체험 혜택입니다. 시작하면 이 체험권은 사용 완료되어 다시 표시되지 않습니다.',
              '<b>체험 진행 중</b> · 실제 자산 및 정산에 반영되지 않습니다. 목표 수익률 도달 시 자동 종료됩니다.': '<b>체험 진행 중</b> · 실제 자산 및 정산과 구분되어 운영됩니다. 목표 수익률 도달 시 자동 종료됩니다.',
              '>모의체험</span>': '>체험</span>',
              'AI PROCESS 모의체험 ': 'AI PROCESS 체험 ',
              '실제 투자금과 분리된 이벤트 체험금으로 운영됩니다.': '이벤트 체험 혜택으로 운영됩니다.',
              'setNotice("관리자 승인 대기 중인 계정입니다.");': 'setNotice("");',
              '"가입 신청이 접수되었습니다. 현재 관리자 승인 대기 중입니다."': '"가입 승인이 완료된 후 로그인할 수 있습니다."',
              'placeholder="가입한 닉네임"': 'placeholder="가입한 닉네임 또는 이름"',
              '"닉네임 또는 비밀번호를 입력해주세요."': '"닉네임 또는 이름과 비밀번호를 입력해주세요."',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # No user-facing Korean '모의' wording should remain in application source.
          text = text.replace('모의체험', '체험').replace('모의 체험', '체험').replace('모의', '체험')
          page.write_text(text, encoding='utf-8')

          # Remove the temporary render-time MutationObserver guard now that source copy is fixed.
          layout = Path('app/layout.js')
          layout_text = layout.read_text(encoding='utf-8')
          layout_text = layout_text.replace('import VipCopyGuard from "./VipCopyGuard";\n', '')
          layout_text = layout_text.replace('        <VipCopyGuard />\n', '')
          layout.write_text(layout_text, encoding='utf-8')

          guard = Path('app/VipCopyGuard.js')
          if guard.exists():
              guard.unlink()

          # Login API already supports nickname + uniquely matching real_name. Align messages with that behavior.
          login = Path('app/api/auth/login/route.js')
          login_text = login.read_text(encoding='utf-8')
          login_text = login_text.replace('닉네임 또는 비밀번호를 확인해주세요.', '닉네임/이름 또는 비밀번호를 확인해주세요.')
          login.write_text(login_text, encoding='utf-8')

          # Remove this one-time workflow in the same commit.
          Path('.github/workflows/one-time-copy-login-cleanup.yml').unlink()

          # Verification: Korean simulation wording and temporary copy guard must be gone from runtime source.
          leftovers = []
          for p in Path('app').rglob('*'):
              if p.is_file() and p.suffix in {'.js', '.jsx', '.ts', '.tsx', '.css'}:
                  s = p.read_text(encoding='utf-8', errors='ignore')
                  if '모의' in s:
                      leftovers.append(str(p))
          if leftovers:
              raise SystemExit('Remaining 모의 wording: ' + ', '.join(leftovers))
          if 'VipCopyGuard' in layout.read_text(encoding='utf-8'):
              raise SystemExit('VipCopyGuard still referenced in layout')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "ai-so20"
          git config user.email "skehjwhnf1257@gmail.com"
          git add -A
          git commit -m "fix: clean VIP copy and existing account login"
          git push origin HEAD:design-rebuild-20261019
