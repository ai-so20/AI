name: P5 Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p5-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-off P1-P3 artifacts
        shell: bash
        run: |
          rm -f \
            scripts/apply-p1-10-member-header-refactor.mjs \
            scripts/apply-p1-11-admin-header-refactor.mjs \
            scripts/apply-p1-13-remove-dead-ai-market-derivations.mjs \
            scripts/apply-p1-2-ai-process-utils-refactor.mjs \
            scripts/apply-p1-3-ai-impact-refactor.mjs \
            scripts/apply-p1-5-chart-panel-refactor.mjs \
            scripts/apply-p1-6-history-panel-refactor.mjs \
            scripts/apply-p1-7-members-panel-refactor.mjs \
            scripts/apply-p1-8-start-panel-refactor.mjs \
            scripts/apply-p1-9-summary-panel-refactor.mjs \
            scripts/apply-p1-final-ai-process-simulation-refactor.mjs \
            scripts/apply-p2-ai-process-service-refactor.mjs \
            scripts/apply-p3-ai-process-redesign.mjs \
            scripts/p1-14-extract-ai-process-data.cjs \
            scripts/p1-4-extract-impact-card.cjs \
            .github/workflows/apply-p1-1-ui-helper-refactor.yml \
            .github/workflows/apply-p1-10-member-header-refactor.yml \
            .github/workflows/apply-p1-11-admin-header-refactor.yml \
            .github/workflows/apply-p1-13-dead-ai-cleanup.yml \
            .github/workflows/apply-p1-14-ai-process-data-refactor.yml \
            .github/workflows/apply-p1-2-ai-process-utils-refactor.yml \
            .github/workflows/apply-p1-3-ai-impact-refactor.yml \
            .github/workflows/apply-p1-4-impact-card-refactor.yml \
            .github/workflows/apply-p1-5-chart-panel-refactor.yml \
            .github/workflows/apply-p1-6-history-panel-refactor.yml \
            .github/workflows/apply-p1-7-members-panel-refactor.yml \
            .github/workflows/apply-p1-8-start-panel-refactor.yml \
            .github/workflows/apply-p1-9-summary-panel-refactor.yml \
            .github/workflows/apply-p1-final-ai-process-simulation-refactor.yml \
            .github/workflows/apply-p2-ai-process-service-refactor.yml \
            .github/workflows/apply-p3-ai-process-redesign.yml \
            .github/workflows/p5-cleanup.yml

      - name: Verify quality gate remains
        shell: bash
        run: |
          test -f .github/workflows/p4-quality-gate.yml
          test -f docs/AI_PROCESS_MAINTENANCE.md
          test -f package-lock.json

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "chore: complete P5 repository cleanup"
          git push
