name: Apply V27 event chat semantic fix

on:
  push:
    paths:
      - ".github/workflows/apply-v27-event-chat-semantic-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V27 event semantic patch
        run: node scripts/apply-v27-event-chat-semantic-fix.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder-secret
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/event-runtime/route.js app/lib/ai-community.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: event start reactions and hide internal event id"
          git push
