name: Apply P1-1 UI helper refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-p1-1-ui-helper-refactor.mjs'
      - '.github/workflows/apply-p1-1-ui-helper-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refactor
        run: node scripts/apply-p1-1-ui-helper-refactor.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-only
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git add app/page.js
          git commit -m 'refactor: P1-1 extract shared UI helpers'
          git push
