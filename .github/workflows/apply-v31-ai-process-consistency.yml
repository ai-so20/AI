name: Apply V31 AI PROCESS consistency

on:
  push:
    paths:
      - ".github/workflows/apply-v31-ai-process-consistency.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V31 patch
        run: node scripts/apply-v31-ai-process-consistency.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: align AI PROCESS amount and chart"
            git push
          fi

# V31 trigger
