name: Apply V19 finance process UI

on:
  push:
    paths:
      - ".github/workflows/apply-v19-finance-process-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V19 finance PROCESS patch
        run: node scripts/apply-v19-finance-process-ui.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build validation
        run: npm run build

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/globals.css
          git commit -m "feat: finance-first AI PROCESS layout and session fallback"
          git push
