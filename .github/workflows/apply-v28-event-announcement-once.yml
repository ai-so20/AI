name: Apply V28 event announcement once
on:
  push:
    paths:
      - '.github/workflows/apply-v28-event-announcement-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V28 patch
        run: node scripts/apply-v28-event-announcement-once.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/event-runtime/route.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: announce each event only once"
          git push
