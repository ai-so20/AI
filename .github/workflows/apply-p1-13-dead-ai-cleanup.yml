name: Apply P1-13 dead AI PROCESS cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-p1-13-dead-ai-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: node scripts/apply-p1-13-remove-dead-ai-market-derivations.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-only
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: P1-13 remove unused AI PROCESS derivations"
          git push
