name: Apply V22 human conversation engine

on:
  push:
    paths:
      - ".github/workflows/apply-v22-human-conversation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V22 conversation patch
        run: node scripts/apply-v22-human-conversation.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
        run: npm run build

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/ai-community.js
          git commit -m "feat: V22 human conversation behavior"
          git push
