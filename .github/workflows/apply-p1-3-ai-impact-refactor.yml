name: Apply P1-3 AI PROCESS impact refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-p1-3-ai-impact-refactor.mjs'
      - '.github/workflows/apply-p1-3-ai-impact-refactor.yml'
      - 'app/lib/ai-process-impact.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply refactor
        run: node scripts/apply-p1-3-ai-impact-refactor.mjs

      - name: Install dependencies
        run: npm install

      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-only
        run: npm run build

      - name: Commit changes
        run: |
          if git diff --quiet app/page.js; then
            echo "No page.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git commit -m "refactor: P1-3 extract AI PROCESS impact aggregation"
          git push origin main
