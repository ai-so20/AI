name: Apply V26 expanded quiz bank

on:
  push:
    paths:
      - ".github/workflows/apply-v26-expanded-quiz-bank.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V26 quiz bank patch
        run: node scripts/apply-v26-expanded-quiz-bank.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/event-runtime/route.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: wire expanded 200-question quiz bank"
          git push
