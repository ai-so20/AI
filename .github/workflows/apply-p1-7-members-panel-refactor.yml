name: Apply P1-7 members panel refactor

on:
  push:
    paths:
      - '.github/workflows/apply-p1-7-members-panel-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refactor
        run: node scripts/apply-p1-7-members-panel-refactor.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-only
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor: P1-7 extract AI PROCESS members panel"
            git push
          fi
