name: Apply P1-9 summary panel refactor

on:
  push:
    paths:
      - '.github/workflows/apply-p1-9-summary-panel-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refactor
        run: node scripts/apply-p1-9-summary-panel-refactor.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: P1-9 extract AI PROCESS summary panel"
          git push
