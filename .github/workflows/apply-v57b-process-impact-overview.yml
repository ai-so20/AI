name: Apply V57b process impact overview
on:
  push:
    paths:
      - 'scripts/apply-v57b-process-impact-overview.mjs'
      - '.github/workflows/apply-v57b-process-impact-overview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V57b patch
        run: node scripts/apply-v57b-process-impact-overview.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-only
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js app/globals.css
          git commit -m 'feat: V57b focus market view on PROCESS impact'
          git push
