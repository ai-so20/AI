name: Apply V48 community and scroll fixes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v48-community-scroll-fixes.mjs'
      - '.github/workflows/apply-v48-community-scroll-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-check-key
    steps:
      - uses: actions/checkout@v4
      - name: Apply V48 patch
        run: node scripts/apply-v48-community-scroll-fixes.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/ai-community.js app/globals.css
          git commit -m "feat: V48 fix home scroll and community variety"
          git push
