name: One-time nickname-name auth rebuild

on:
  push:
    branches:
      - design-rebuild-20261019
    paths:
      - '.github/workflows/one-time-modern-auth.yml'

permissions:
  contents: write

jobs:
  rebuild-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-rebuild-20261019
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 scripts/one_time_modern_auth.py
      - name: Validate source and build
        run: |
          ! grep -n 'type="password"\|passwordCandidates\|VIP PRIVATE</h1>\|profile-01.jpg" alt="AI PROCESS VIP"' app/page.js
          ! grep -n '비밀번호' app/page.js app/api/auth/login/route.js app/api/auth/signup/route.js
          npm run build
      - name: Commit validated auth rebuild
        run: |
          git config user.name "ai-so20"
          git config user.email "skehjwhnf1257@gmail.com"
          git rm .github/workflows/one-time-modern-auth.yml scripts/one_time_modern_auth.py
          git add app/page.js app/api/auth/login/route.js app/api/auth/signup/route.js
          git commit -m "fix: restore nickname-name login and modern private access"
          git push origin HEAD:design-rebuild-20261019
