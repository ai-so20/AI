          for key, value in replacements.items():
              pattern = rf'  {re.escape(key)}:\s*\{{.*?\n  \}},'
              page, count = re.subn(pattern, value, page, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'failed to replace style {key}: {count}')

          banned = ['VIP PRIVATE</h1>', 'profile-01.jpg" alt="AI PROCESS VIP"', 'type="password"', 'passwordCandidates', 'normalizePasswordInput']
