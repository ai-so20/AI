          <button type="submit" disabled={working} style={styles.primary}>
            {working ? "처리 중..." : mode === "login" ? "로그인" : "가입 신청하기"}
          </button>
        </form>

        {notice && <div style={styles.notice}>{notice}</div>}

        <div style={styles.footer}>
          PRIVATE MEMBER SERVICE · AI PROCESS
        </div>
      </section>
