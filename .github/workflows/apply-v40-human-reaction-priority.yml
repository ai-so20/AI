name: Apply V40 human reaction priority
on:
  push:
    paths:
      - '.github/workflows/apply-v40-human-reaction-priority.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V40 patch
        run: node scripts/apply-v40-human-reaction-priority.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/ai-community.js
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'feat: prioritize contextual replies to real members'
            git push
          fi
