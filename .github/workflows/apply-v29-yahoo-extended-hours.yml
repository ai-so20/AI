name: Apply V30 bundled market and chart fixes

on:
  push:
    paths:
      - ".github/workflows/apply-v29-yahoo-extended-hours.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bundled fixes
        run: node scripts/apply-v29-yahoo-extended-hours.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/market-sim/route.js app/page.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: restore stock movement and persistent AI chart"
            git push
          fi
