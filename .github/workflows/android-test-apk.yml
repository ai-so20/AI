name: AI 프로세스 - Android APK 동작 검증
on:
  push:
    branches:
      - test/android-capacitor-20261113
    paths:
      - 'android-test/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android-test

    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK (GitHub hosted preinstalled SDK)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" >> "$GITHUB_ENV"
          echo "SDK root: ${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMGR="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMGR"
          echo "SDK manager: $SDKMGR"
          "$SDKMGR" --list_installed | tail -30
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build unsigned-store / debug-signed APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Validate artifact exists and has ZIP integrity
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -1
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK immediately after build
        uses: actions/upload-artifact@v4
        with:
          name: ai-process-test-debug-apk
          path: android-test/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM hardware acceleration if available
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device unavailable; emulator will use software mode."
          fi
      - name: Install and launch in Android emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            mkdir -p android-test/emulator-check
            adb install -r android-test/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.vipai.aiprocess.smoketest/.MainActivity
            sleep 25
            APP_PID="$(adb shell pidof com.vipai.aiprocess.smoketest | tr -d '\r')"
            test -n "$APP_PID"
            echo "Verified running Android app PID: $APP_PID" | tee android-test/emulator-check/process.txt
            adb exec-out screencap -p > android-test/emulator-check/screen.png
            test "$(wc -c < android-test/emulator-check/screen.png)" -gt 6000
            file android-test/emulator-check/screen.png
            adb shell dumpsys activity activities > android-test/emulator-check/activity.txt
            adb logcat -d -t 2000 > android-test/emulator-check/logcat.txt
            ls -lh android-test/emulator-check/
      - name: Export emulator screenshot and note
        if: always()
        run: |
          echo "emulator_step=${{ steps.emulator.outcome }}" > emulator-result.txt
          ls -lh emulator-check/ || true
      - name: Upload emulator verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-process-android-emulator-check
          path: |
            android-test/emulator-check/
            android-test/emulator-result.txt
          if-no-files-found: warn
          retention-days: 14
