name: Apply V36 chat marker cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-v35-event-message-linebreaks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leaked V35 marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          s = p.read_text()
          bad = '>/* V35 preserve chat line breaks */'
          if bad not in s:
              print('marker already absent')
          else:
              p.write_text(s.replace(bad, '>'))
              print('marker removed')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: remove visible V35 marker from chat'
            git push
          fi
