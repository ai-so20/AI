name: Apply P1-5 chart panel refactor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-p1-5-chart-panel-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refactor
        run: node scripts/apply-p1-5-chart-panel-refactor.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-only
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet -- app/page.js; then
            echo "No page changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git commit -m "refactor: P1-5 extract AI PROCESS chart panel"
          git push
