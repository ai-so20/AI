name: Apply V42 event reaction variety
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v42-event-reaction-variety.mjs'
      - '.github/workflows/apply-v42-event-reaction-variety.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V42 patch
        run: node scripts/apply-v42-event-reaction-variety.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/ai-community.js
          git commit -m "fix: diversify event reactions and reduce repetition"
          git push
