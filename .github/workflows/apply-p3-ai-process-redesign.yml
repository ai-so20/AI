name: Apply P3 AI PROCESS redesign

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-p3-ai-process-redesign.mjs'
      - 'app/ai-process-p3.css'
      - '.github/workflows/apply-p3-ai-process-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P3 redesign
        run: node scripts/apply-p3-ai-process-redesign.mjs
      - name: Install dependencies
        run: npm install
      - name: Build validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-validation-only
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.js app/components/ai-process/AiProcessSummaryPanel.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "design: complete P3 AI PROCESS hierarchy redesign"
            git push
          fi
