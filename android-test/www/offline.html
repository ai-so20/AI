<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AI 프로세스 · 연결 안내</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#173554;background:#f5f8fd}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 22px calc(24px + env(safe-area-inset-bottom))}
  main{width:100%;max-width:370px}
  .mark{display:block;color:#1c70d5;font-size:15px;font-weight:840;letter-spacing:-.4px;margin:0 0 54px}
  .symbol{width:54px;height:54px;display:grid;place-items:center;background:#e6f0fe;border-radius:15px;color:#186bd3;margin-bottom:22px}
  h1{font-size:24px;line-height:1.4;letter-spacing:-.7px;margin:0 0 10px}
  p{font-size:14px;line-height:1.8;color:#5f758d;margin:0}
  button{margin:29px 0 0;display:block;width:100%;min-height:49px;border:0;border-radius:10px;background:#166fd8;color:#fff;font-size:15px;font-weight:750;cursor:pointer}
  .help{font-size:12px;margin-top:15px;color:#74879b;text-align:center}
  svg{width:27px;height:27px;stroke:currentColor;stroke-width:2;fill:none}
</style>
</head>
<body>
<main>
  <strong class="mark">AI 프로세스</strong>
  <span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9a13 13 0 0 1 18 0"/><path d="M6.5 12.5a8 8 0 0 1 11 0"/><path d="M10 16a3 3 0 0 1 4 0"/><path d="M12 20h.01"/><path d="m3 3 18 18"/></svg></span>
  <h1>서버에 연결할 수 없습니다</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요. 기존 계정과 이용 기록은 그대로 유지됩니다.</p>
  <button type="button" id="retry">다시 연결하기</button>
  <p class="help">오류가 계속되면 네트워크를 변경한 뒤 다시 실행해 주세요.</p>
</main>
<script>
  // This screen is stored in the APK and requires no internet connection.
  // Only the fixed, first-party HTTPS login URL is used for retry.
  document.getElementById("retry").addEventListener("click",()=>{
    window.location.replace("https://ai-r6u0rn1ma-vipai.vercel.app/design-entry");
  });
</script>
</body>
</html>
